<!DOCTYPE html>
<html>
<head>
    <title>Smart Agriculture AI</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: linear-gradient(to right, #d4fc79, #96e6a1);
        }

        .box {
            background: white;
            padding: 30px;
            margin: 100px auto;
            width: 320px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        label {
            font-weight: bold;
            display: block;
            text-align: left;
            margin-top: 10px;
        }

        input {
            margin: 5px 0;
            padding: 10px;
            width: 90%;
        }

        button {
            margin-top: 15px;
            padding: 10px;
            width: 100%;
            background: green;
            color: white;
            border: none;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>

<body>

<div class="box">
    <h2>🌱 Smart Agriculture AI</h2>

    <label>Nitrogen (N)</label>
    <input id="N">

    <label>Phosphorus (P)</label>
    <input id="P">

    <label>Potassium (K)</label>
    <input id="K">

    <button onclick="predict()">🚀 Predict Crop</button>

    <h3 id="result"></h3>
</div>

<script>
function predict() {

    document.getElementById("result").innerHTML = "⏳ Predicting...";

    fetch("https://tabetha-posteruptive-misty.ngrok-free.dev", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            N: parseInt(document.getElementById("N").value),
            P: parseInt(document.getElementById("P").value),
            K: parseInt(document.getElementById("K").value)
        })
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById("result").innerHTML =
            "🌾 Top Crops:<br>" + data.top_crops.join("<br>");
    })
    .catch(err => {
        document.getElementById("result").innerHTML =
            "❌ Error connecting to server";
    });
}
</script>

</body>
</html>
