<!DOCTYPE html>
<html>
<head>
  <title>Smart Agriculture AI</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #f0f8f5;
    }
    .box {
      background: white;
      padding: 30px;
      margin: 100px auto;
      width: 300px;
      border-radius: 10px;
      box-shadow: 0 0 10px gray;
    }
    input {
      margin: 10px;
      padding: 10px;
      width: 80%;
    }
    button {
      padding: 10px;
      background: green;
      color: white;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="box">
  <h2>🌱 Smart Agriculture AI</h2>

  <input id="N" placeholder="Nitrogen"><br>
  <input id="P" placeholder="Phosphorus"><br>
  <input id="K" placeholder="Potassium"><br>

  <button onclick="predict()">Predict Crop</button>

  <h3 id="result"></h3>
</div>

<script>
function predict(){
  fetch("YOUR_NGROK_LINK/predict_crop", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      N: document.getElementById("N").value,
      P: document.getElementById("P").value,
      K: document.getElementById("K").value
    })
  })
  .then(res => res.json())
  .then(data => {
    document.getElementById("result").innerHTML =
      "🌾 Crop: " + data.recommended_crop;
  });
}
</script>

</body>
</html>
